services:
  postgres:
    container_name: postgres
    image: postgres
    environment:
      POSTGRES_USER: mobin
      POSTGRES_PASSWORD: password
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - "5433:5432"
    networks:
      - postgres
    restart: unless-stopped

  zipkin:
    container_name: zipkin
    image: openzipkin/zipkin
    ports:
      - "9411:9411"
    networks:
      - postgres
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4-management
#    environment:
#      RABBITMQ_DEFAULT_USER: mobin
#      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - postgres
    restart: unless-stopped

networks:
  postgres:
    driver: bridge

volumes:
  postgres:
