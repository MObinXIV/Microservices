server:
  port: 8081
spring:
  application:
    name: notification
  rabbitmq:
    host: localhost
    port: 5672
    username: mobin
    password: password
    template:
      exchange: internal.exchange
      routing-key: internal.notification.routing-key
      default-receive-queue: notification.queue
      observation-enabled: true
    addresses: localhost:5672
    listener:
      simple:
        observation-enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5433/notification
    username: mobin
    password: password
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
    hibernate:
      ddl-auto: create-drop
management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true
    enabled: false
